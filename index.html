
  <!DOCTYPE html>
  <html lang="it">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
      <title>Alberto Pecchini — Perito geometra & sviluppatore website</title>
      <meta name="description" content="Alberto Pecchini, perito geometra e sviluppatore website di Mantova. Web design, sviluppo di siti web e branding digitale." />
      <meta name="theme-color" content="#e95420" />
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-status-bar-style" content="default" />
      <meta name="apple-mobile-web-app-title" content="Alberto Pecchini" />
      <link rel="icon" href="/favicon.ico" sizes="48x48" />
      <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
      <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
      <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
      <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
      <link rel="manifest" href="/site.webmanifest" />
      <link rel="stylesheet" href="/bootstrap-italia/css/bootstrap-italia.min.css" />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <!-- Caratteri del sito da font_italia.css: Titillium Web + Roboto Mono + Lora -->
      <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600;1,700&family=Roboto+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Lora:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
      <!-- Tema globale: calcolato PRIMA del primo paint per evitare il flash.
           mode "manuale" → ultima scelta; altrimenti il sensore orario
           (08:00–19:59 chiaro, il resto scuro). -->
      <script>
        (function () {
          try {
            // Preferenza condivisa tra i sottodomini: cookie su .albertopecchini.it,
            // poi fallback a localStorage (dev/preview). Evita il flash di tema
            // arrivando su un sottodominio senza il valore in localStorage locale.
            function readPref(k) {
              var m = document.cookie.match(new RegExp("(?:^|; )" + k + "=([^;]*)"));
              if (m) return decodeURIComponent(m[1]);
              try { return localStorage.getItem(k); } catch (e) { return null; }
            }
            var mode = readPref("ap-theme-mode");
            var theme;
            if (mode === "manual") {
              theme = readPref("ap-theme-manual") === "dark" ? "dark" : "light";
            } else {
              var h = new Date().getHours();
              theme = h >= 8 && h < 20 ? "light" : "dark";
            }
            var de = document.documentElement;
            de.classList.toggle("dark", theme === "dark");
            de.setAttribute("data-ap-theme", theme);
            de.style.setProperty("--ap-boot-bg", theme === "dark" ? "#1b151a" : "#faf8f6");
            localStorage.setItem("games-dark", theme === "dark" ? "1" : "0");
            localStorage.setItem("ms-theme", theme);
          } catch (e) {}
        })();
      </script>
      <!-- Sfondo fisso fin dal primo paint: evita il flash nero/bianco quando si
           cambia rotta (es. dal gioco → home) prima che React monti. -->
      <style>html, body { height: 100%; margin: 0; background: var(--ap-boot-bg, #faf8f6); } #root { height: 100%; }</style>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      <script src="/bootstrap-italia/js/bootstrap-italia.bundle.min.js"></script>
    </body>
  </html>
