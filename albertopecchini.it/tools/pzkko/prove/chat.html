<!doctype html>
<html lang="it" class="js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>prova: la chat col bot dei $pzk</title>
<!-- La pagina di prova della chat (npm run dev:pzkko → http://localhost:5182/prova/chat/): solo i due tasti in alto a
     sinistra (il wallet vero e il cercapersone della chat) su un muro vuoto, coi file veri di pzkko/chat/. Il css del
     tasto qui sotto è quello da copiare in pzkko/index.html sotto .wallet-tasto, come il loader in fondo. -->
<style>
@font-face{font-family:"Anton";src:url(/fonts/anton.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Special Elite";src:url(/fonts/special-elite.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Permanent Marker";src:url(/fonts/permanent-marker.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Fake Receipt";src:url(/fonts/fake-receipt.woff2) format("woff2");font-weight:400;font-display:swap}
html,body{margin:0;min-height:100%;background:#8e8e8a url(/art/muro.webp) center/900px repeat;color:#111;font:16px/1.4 "Special Elite",monospace}
body::after{content:"";position:fixed;inset:0;background:rgba(20,16,12,.35);pointer-events:none}
.prova-morte{position:fixed;right:16px;bottom:16px;z-index:1;display:flex;gap:8px}
.prova-morte button{padding:8px 14px;border:0;background:#ffd400;color:#111;font:400 14px/1.2 "Permanent Marker",cursive;cursor:pointer;transform:rotate(1deg);box-shadow:0 3px 6px rgba(0,0,0,.4)}
.prova-morte [data-prova="muori"]{background:#c74337;color:#fff;transform:rotate(-1.5deg)}
.nota{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:1;padding:8px 14px;background:#ffd400;color:#111;font:400 14px/1.2 "Permanent Marker",cursive;transform:translateX(-50%) rotate(-1deg);box-shadow:0 3px 6px rgba(0,0,0,.4)}

/* ── il tasto del wallet, com'è in index.html ── */
.wallet-tasto{position:fixed;z-index:85;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));width:calc(52px * 792 / 214);height:52px;padding:0;border:0;background:none;color:#e9e4d8;cursor:pointer;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.5)) drop-shadow(0 10px 14px rgba(0,0,0,.3));transition:transform .18s cubic-bezier(.2,1.4,.4,1);-webkit-tap-highlight-color:transparent}
.wallet-tasto img{position:absolute;inset:0;width:100%;height:100%;max-width:none;pointer-events:none}
.wallet-tasto canvas,.wallet-tasto::after{position:absolute;left:7.828%;top:29.673%;width:82.197%;height:42.523%}
.wallet-tasto canvas{display:block;background:#040605}
/* il vetro sopra i led: un riflesso in diagonale e l'ombra della cornice */
.wallet-tasto::after{content:"";pointer-events:none;background:linear-gradient(172deg,rgba(255,255,255,.1),rgba(255,255,255,.035) 46%,rgba(255,255,255,0) 48%);box-shadow:inset 0 1px 3px rgba(0,0,0,.85),inset 0 -1px 2px rgba(0,0,0,.5)}
.wallet-tasto .wt-piu{position:absolute;left:50%;top:100%;margin-top:6px;transform:translateX(-50%);font:400 20px/1 "Fake Receipt",monospace;color:#46ff7d;text-shadow:0 0 8px rgba(70,255,125,.9),0 2px 3px rgba(0,0,0,.6);opacity:0;pointer-events:none;white-space:nowrap}
.wallet-tasto .wt-piu.va{animation:wt-piu 1.6s ease-out forwards}
@keyframes wt-piu{0%{opacity:0;transform:translate(-50%,6px)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-26px)}}
.wallet-tasto[hidden]{display:none}
@media (hover:hover){.wallet-tasto:hover{transform:scale(1.03)}}
.wallet-tasto:active{transform:scale(.97)}
.wallet-tasto:focus-visible{outline:3px solid #ffd400;outline-offset:4px}
@media (max-width:899px){.wallet-tasto{width:calc(46px * 792 / 214);height:46px}}

/* ── DA COPIARE IN index.html ── il tasto della chat col bot (chat/), sotto il wallet: un cercapersone nero con lo
   schermo lcd verde dove vive il tomodachi, una chiocciolina a pixel (chat/tomodachi.js); il led rosso lampeggia quando c'è un premio da riscuotere. Negli strumenti che
   fotografano la pagina non c'è (navigator.webdriver), ?chat lo fa vedere lo stesso. Senza script non c'è ── */
.chat-tasto{position:fixed;z-index:85;top:calc(max(12px,env(safe-area-inset-top)) + 62px);left:max(12px,env(safe-area-inset-left));width:112px;height:65px;padding:0;border:0;background:none;cursor:pointer;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.5)) drop-shadow(0 10px 14px rgba(0,0,0,.3));transition:transform .18s cubic-bezier(.2,1.4,.4,1);-webkit-tap-highlight-color:transparent}
.chat-tasto img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:contain;pointer-events:none}
.chat-tasto .ct-lcd{position:absolute;left:8.352%;top:24.677%;width:66.294%;height:56.202%;display:block;border-radius:1px;background:#a9bc96;box-shadow:inset 0 0 4px rgba(0,0,0,.6);overflow:hidden}
.chat-tasto .ct-lcd canvas{display:block;width:100%;height:100%;image-rendering:pixelated} /* il tomodachi (chat/tomodachi.js) */
/* il cercapersone scassato (23.10, dopo una morte): le crepe sul vetro dell'lcd (art/chat-pager-crepe/, chat.js le mette
   nel tasto da subito, nascoste), sopra la chiocciolina e le righe del tubo; l'ombra scura le fa leggere sull'lcd chiaro */
.chat-tasto .ct-crepe{position:absolute;inset:0;z-index:55;width:100%;height:100%;object-fit:cover;object-position:70% 30%;pointer-events:none;display:none;filter:drop-shadow(0 0 .5px rgba(0,0,0,.9))}
.chat-tasto.scassato .ct-crepe{display:block}
.chat-tasto .ct-led{position:absolute;left:84.638%;top:25.581%;width:2.685%;height:4.91%;min-width:3px;min-height:3px;border-radius:50%;background:transparent}
.chat-tasto.msg .ct-led{background:#ff3b2e;box-shadow:0 0 6px #ff3b2e,0 0 12px rgba(255,59,46,.6);animation:ct-lamp 1.2s steps(2) infinite}
@keyframes ct-lamp{50%{opacity:.25}}
/* il led che lavora (chat/led.js): sfarfalla come la spia del disco di un PC finché il sistema fa qualcosa */
.chat-tasto .ct-led.lavora{background:#ff4a3a;box-shadow:0 0 5px #ff3b2e,0 0 11px rgba(255,59,46,.65);animation:none;opacity:1}
.chat-tasto[hidden]{display:none}
html:not(.js) .chat-tasto{display:none}
@media (hover:hover){.chat-tasto:hover{transform:scale(1.04)}}
.chat-tasto:active{transform:scale(.96)}
.chat-tasto:focus-visible{outline:3px solid #ffd400;outline-offset:4px}
@media (max-width:899px){.chat-tasto{top:calc(max(12px,env(safe-area-inset-top)) + 54px);width:96px;height:56px}}
@media (prefers-reduced-motion:reduce){.chat-tasto{transition:none}.chat-tasto.msg .ct-led{animation:none}}
</style>
</head>
<body>
<button class="wallet-tasto" type="button" aria-label="wallet: i tuoi $pzk, il conto e la borsa" hidden><img src="/art/wallet-banner/banner.webp" alt="" width="792" height="214"><canvas class="wt-led" aria-hidden="true"></canvas></button>
<!-- DA COPIARE IN index.html: il cercapersone della chat col bot (chat/), sotto il wallet -->
<button class="chat-tasto" type="button" aria-label="chat: parla col bot dei $pzk" title="chat col bot" hidden><img src="/art/chat-pager-grande/pager-piccolo.webp" alt="" width="336" height="194"><span class="ct-lcd" aria-hidden="true"></span><span class="ct-led" aria-hidden="true"></span></button>
<div class="prova-morte" role="group" aria-label="prove del cercapersone scassato"><button type="button" data-prova="muori">muori</button><button type="button" data-prova="ripara">ripara</button></div>
<p class="nota">pagina di prova: solo la chat, senza il muro. Non va online.</p>

<script type="module">
const q = new URLSearchParams(location.search)
const nel = location.hash.slice(1)
// il wallet, come in index.html
{
  const tasto = document.querySelector('.wallet-tasto')
  tasto.hidden = false
  let modulo = null
  const carica = () => (modulo ??= Promise.all([import('/wallet/wallet.js'), new Promise((ok) => { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = '/wallet/wallet.css'; l.onload = l.onerror = ok; document.head.appendChild(l) })])
    .then(([m]) => { m.prepara(tasto); return m }).catch((e) => { modulo = null; console.warn('wallet non caricato', e); throw e }))
  const apri = (sezione) => carica().then((m) => m.apri(sezione)).catch(() => {})
  tasto.addEventListener('click', () => apri())
  document.addEventListener('pzkko-wallet', (e) => apri(e.detail?.sezione))
  ;(window.requestIdleCallback ?? setTimeout)(() => carica().catch(() => {}), { timeout: 3500 })
  if (nel === 'wallet') apri()
}
// ── DA COPIARE IN index.html ── la chat col bot (chat/): il cercapersone sotto il wallet. Il modulo arriva da solo
// appena la pagina è tranquilla (così il cercapersone sa se c'è un premio da riscuotere) e subito al clic; #chat la apre,
// l'evento pzkko-chat pure (con detail.comando si scrive un comando). Gli strumenti che fotografano non la vedono ──
{
  const tasto = document.querySelector('.chat-tasto')
  if (tasto && (!navigator.webdriver || q.has('chat'))) {
    tasto.hidden = false
    let modulo = null
    const carica = () => (modulo ??= Promise.all([import('/chat/chat.js'), new Promise((ok) => { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = '/chat/chat.css'; l.onload = l.onerror = ok; document.head.appendChild(l) })])
      .then(([m]) => { m.prepara(tasto); return m }).catch((e) => { modulo = null; console.warn('chat non caricata', e); throw e }))
    const apri = (comando) => carica().then((m) => m.apri(comando)).catch(() => {})
    tasto.addEventListener('click', () => apri())
    document.addEventListener('pzkko-chat', (e) => apri(e.detail?.comando))
    ;(window.requestIdleCallback ?? setTimeout)(() => carica().catch(() => {}), { timeout: 4000 })
    if (nel === 'chat') apri()
  }
}
// ── SOLO PROVA ── il cercapersone scassato (23.10): «muori» fa la morte vera di chat.js (il 20 % dei $pzk, e il
// cercapersone si scassa; con la chat aperta arriva anche la scheda), «ripara» lo rimette nuovo senza pagare
document.querySelector('.prova-morte').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-prova]')
  if (!b) return
  const [chat, zaino] = await Promise.all([import('/chat/chat.js'), import('/chat/zaino.js')])
  if (b.dataset.prova === 'muori') await chat.muori(null, 'prova: ti sei sporto troppo dal ponte di San Giorgio.')
  else zaino.aggiustaPager()
})
</script>
</body>
</html>
