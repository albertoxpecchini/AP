<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pagina non trovata, pzkko</title>
<meta name="description" content="L'indirizzo non esiste o è cambiato. Torna alla home di pzkko.it.">
<meta name="robots" content="noindex">
<meta name="author" content="Alberto Pecchini">
<link rel="author" href="https://www.albertopecchini.it">
<meta name="theme-color" content="#665d56">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/fonts/anton.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/special-elite.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/art/insegna.svg" as="image">
<style>
/* I caratteri dei volantini: Anton e Archivo Black (OFL), Special Elite e Permanent Marker (Apache 2.0), da Google Fonts, serviti da qui. */
@font-face{font-family:"Anton";src:url(/fonts/anton.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Archivo Black";src:url(/fonts/archivo-black.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Special Elite";src:url(/fonts/special-elite.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Permanent Marker";src:url(/fonts/permanent-marker.woff2) format("woff2");font-weight:400;font-display:swap}

:root{
  --pietra:#665d56; --pietra2:#58504a; --asfalto:#3a3937;
  --inchiostro:#161616; --inchiostro2:#3a3632;
  --marker:#111; --marker-rosso:#a50d25; --marker-blu:#1446a0;
  --fa:"Anton",Impact,"Arial Narrow Bold",sans-serif;
  --fb:"Archivo Black","Arial Black",sans-serif;
  --ft:"Special Elite","Courier New",monospace;
  --fm:"Permanent Marker","Comic Sans MS",cursive;
  --ombra:0 2px 3px rgba(0,0,0,.25),0 10px 18px -6px rgba(0,0,0,.45);
  --ombra-su:0 4px 6px rgba(0,0,0,.28),0 22px 30px -8px rgba(0,0,0,.5);
  --eo:cubic-bezier(.22,1,.36,1);
  --u:calc(100cqw / 1280);
  /* la sera: 0 = giorno, 1 = notte (lo script li regola sul tramonto di Mantova); --f-* = lo sfarfallio */
  --notte:0; --insegna:0; --lampioni:0; --f-insegna:1; --f-lampioni:1;
  /* le auto che passano: posizione e forza dei fari (0..1 della larghezza), colore, fanali rossi, neon sotto la scocca */
  --auto-x:.5; --auto-l:0; --auto-c:255,226,170; --freno:0; --freno-x:1.1; --neon-auto:0;
  color-scheme:light dark;
}

*,*::before,*::after{box-sizing:border-box}
html{background:var(--pietra);-webkit-text-size-adjust:100%;scrollbar-color:#8a8784 var(--pietra2)}
body{margin:0;min-height:100svh;color:var(--inchiostro);font:400 16px/1.4 var(--ft);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit}
::selection{background:#ffd400;color:#111}
:focus-visible{outline:3px solid #ffd400;outline-offset:3px}
h1,h2,h3,p,ul{margin:0}
img{display:block;max-width:100%;height:auto}

/* ── la strada: il muro del palazzo, la saracinesca, la soglia ────────── */
.strada{--stipite:clamp(10px,3vw,40px);position:relative;isolation:isolate;overflow:clip;background:
  radial-gradient(90% 520px at 50% 0%,rgba(255,250,240,.07),transparent 70%),
  linear-gradient(rgba(20,16,12,.32),transparent 90px),
  url(/art/intonaco.svg) 0 0/640px repeat,
  var(--pietra);padding:0 var(--stipite)}

/* l'insegna sopra la porta: un cassonetto disegnato in SVG (art/insegna.svg) con le lettere a scatola, le colature
   e la ruggine; l'h1 è il suo testo. Di sera si scurisce col resto, al tramonto si accendono i tubi al neon dentro
   le lettere (art/insegna-notte.svg, stessa tela, sovrapposta) */
.portale{position:relative;z-index:32;padding:clamp(18px,3.2vw,40px) 0 0;display:flex;justify-content:center;pointer-events:none}
.portale h1{position:relative;margin:0;width:min(100%,840px)}
.insegna{position:relative;z-index:1;width:100%;filter:brightness(calc(1 - .55 * var(--notte)))}
.insegna.notte{position:absolute;inset:0;z-index:2;filter:none;opacity:calc(var(--insegna) * var(--f-insegna))}
.insegna-luce{position:absolute;inset:-14% -6% 0;z-index:0;pointer-events:none;mix-blend-mode:screen;filter:blur(14px);background:radial-gradient(50% 46% at 50% 44%,rgba(255,214,150,.4),rgba(255,200,130,.12) 60%,transparent 78%);opacity:calc(var(--insegna) * var(--f-insegna))}
.insegna-cono{position:absolute;left:-18%;right:-18%;top:84%;height:min(60vh,520px);z-index:0;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(50% 100% at 50% 0%,rgba(255,220,170,.3),rgba(255,214,160,.08) 50%,transparent 75%);opacity:calc(var(--insegna) * var(--f-insegna))}

/* la saracinesca: la lamiera fotografata si ripete (una doga ogni 114 px della tela a 1600) */
.muro{position:relative;container-type:inline-size;max-width:1280px;margin:0 auto;isolation:isolate;
  box-shadow:inset 0 10px 14px -8px rgba(0,0,0,.7),inset 0 -8px 10px -8px rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.5)}
.muro::before{content:"";position:absolute;inset:0;z-index:-1;background:url(/art/muro.webp) 0 0/2200px auto repeat;background-color:#8e8e8a;filter:brightness(calc(1 - .5 * var(--notte))) saturate(calc(1 - .2 * var(--notte)))}
/* la sera cala su tutto: un velo blu notte in multiply */
.buio{position:absolute;inset:0;z-index:30;pointer-events:none;mix-blend-mode:multiply;background:#0a0d1c;opacity:calc(var(--notte) * .64)}
/* i fari delle auto che passano in strada (screen sul muro e sui fogli), poi i fanali rossi dal lato in cui se ne vanno */
.fari,.freni,.neonauto{position:fixed;inset:0;z-index:33;pointer-events:none;mix-blend-mode:screen}
.fari{opacity:var(--auto-l);background:radial-gradient(34% 62% at calc(var(--auto-x) * 100%) 68%,rgba(var(--auto-c),.95),rgba(var(--auto-c),.38) 36%,transparent 68%)}
.freni{opacity:var(--freno);background:radial-gradient(28% 52% at calc(var(--freno-x) * 100%) 70%,rgba(255,36,24,.95),rgba(255,30,20,.35) 40%,transparent 70%)}
.neonauto{opacity:var(--neon-auto);background:radial-gradient(44% 14% at calc(var(--auto-x) * 100%) 100%,rgba(40,220,255,.85),rgba(40,200,255,.3) 50%,transparent 75%)}
/* la condensa dei condizionatori: la goccia cade dal tubo sulla lamiera, uno spruzzo, e il rivolo resta */
.goccia,.spruzzo{position:absolute;left:0;top:0;z-index:34;pointer-events:none;opacity:0;will-change:transform}
.goccia{width:9px}
.spruzzo{width:26px}
/* le formiche: piccole, in giro per il muro */
.formica{position:absolute;left:0;top:0;width:11px;z-index:6;pointer-events:none;will-change:transform}
/* le mosche: si posano sul muro e sui fogli, si girano, si puliscono le zampe e volano via.
   Quattro foto della stessa mosca (posata, che si pulisce, due battiti d'ali) impilate col centro del
   corpo allineato (--ax/--ay, in px della foto); lo script mostra una foto alla volta (data-f) e muove
   il contenitore, scalato a ~14 px di corpo. L'ombra si allarga quando la mosca si stacca dal muro. */
.mosca{position:absolute;left:0;top:0;width:0;height:0;z-index:6;pointer-events:none;will-change:transform;filter:drop-shadow(5px 9px 4px rgba(0,0,0,.45))}
.mosca.vola{filter:drop-shadow(45px 80px 20px rgba(0,0,0,.2))}
.mosca img{position:absolute;left:calc(-1px * var(--ax));top:calc(-1px * var(--ay));max-width:none;display:none}
.mosca[data-f="posata"] .m-posata,.mosca[data-f="zampe"] .m-zampe,.mosca[data-f="vola"] .m-vola,.mosca[data-f="vola2"] .m-vola2{display:block}
/* i riflessi sulla lamiera: la stessa foto, a contrasto alto, in screen, dove battono i fari */
.muro::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;mix-blend-mode:screen;background:url(/art/muro.webp) 0 0/2200px auto repeat;filter:grayscale(1) contrast(3.2) brightness(1.25);opacity:calc(.75 * var(--auto-l));
  -webkit-mask-image:radial-gradient(34% 100% at calc(var(--auto-x) * 100%) 50%,#000,transparent 70%);
  mask-image:radial-gradient(34% 100% at calc(var(--auto-x) * 100%) 50%,#000,transparent 70%)}
.parete{position:relative;height:calc(2258 * var(--u))}
.gruppo{display:contents}

/* ogni cosa sul muro è posizionata in 1280esimi (e in 390esimi sul telefono) */
.it{position:absolute;left:calc(var(--px) * var(--u));top:calc(var(--py) * var(--u));width:calc(var(--pw) * var(--u));--px:var(--x);--py:var(--y);--pw:var(--w);--pr:var(--r,0deg);transform:rotate(var(--pr))}
.tag{z-index:0;pointer-events:none;mix-blend-mode:multiply;opacity:.92}
.tag.chiaro{mix-blend-mode:normal;opacity:.95}
.man{z-index:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3)) drop-shadow(0 8px 14px rgba(0,0,0,.28))}
.pezzo{z-index:1;pointer-events:none}

/* ── le parole sprayate che danno il nome alle zone: graffiti veri (art/scritte/), sotto i fogli ── */
.spray{z-index:0;margin:0;scroll-margin-top:24px}
.spray img{mix-blend-mode:multiply;opacity:.95}
.spray.bianco img,.spray.chiaro img{mix-blend-mode:normal}

/* ── i volantini: carta fotografata, testo vero sopra ───────────────────── */
.vol{z-index:3;container-type:inline-size;isolation:isolate;aspect-ratio:var(--ar);display:flex;flex-direction:column;filter:drop-shadow(0 2px 3px rgba(0,0,0,.28)) drop-shadow(0 10px 16px rgba(0,0,0,.3));
  transition:transform .32s var(--eo),filter .32s var(--eo)}
.vol.sotto{z-index:2}
.foglio{position:absolute;inset:0;background:var(--carta) center/100% 100% no-repeat;transform:scaleX(var(--flip,1))}
.testo{position:relative;flex:1;display:flex;flex-direction:column;gap:2.2cqw;padding:var(--pad)}
.vol:has(.tagliandi) .testo{padding-bottom:var(--giu)}
.arte{width:var(--aw,62%);margin:0 auto;mix-blend-mode:multiply;flex:none;align-self:var(--aa,center)}
.vol h3,.vol .titolo{font:400 max(26px,18cqw)/.95 var(--fa);letter-spacing:.005em;color:var(--titolo,var(--inchiostro));text-wrap:balance}
.vol h3 a,.vol .titolo a{text-decoration:none}
.vol h3 a::after{content:"";position:absolute;inset:0;z-index:1}
.vol p{font:400 max(12px,5.4cqw)/1.28 var(--ft);color:var(--testo,var(--inchiostro))}
.vol .forte{font-family:var(--fb);font-size:max(12px,5cqw);letter-spacing:-.01em}
.vol .mano{font:400 max(14px,7.2cqw)/1.05 var(--fm);color:var(--marker-c,var(--marker));transform:rotate(-2deg);align-self:flex-start}
.vol .mano.vai{align-self:flex-end;transform:rotate(-4deg)}
.vol .freccia{display:inline-block;width:1.5em;height:.75em;vertical-align:-.1em;margin-left:.15em;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.vol .siti .freccia{width:1.1em;height:.55em;margin:0 .35em 0 0;stroke-width:3.5;color:var(--marker-rosso)}
.vol .mano a{text-decoration:none}
.vol .adesivo{position:absolute;right:-6%;bottom:-4%;width:34%;z-index:2;transform:rotate(-12deg);pointer-events:none}
.vol .handle{font:400 max(13px,6cqw)/1.1 var(--fm);color:var(--marker-c,var(--marker));margin-top:auto;overflow-wrap:anywhere;padding-bottom:2cqw}
.vol .siti{list-style:none;padding:0;font:400 max(12px,5.2cqw)/1.3 var(--ft)}
.vol .siti li{display:flex;align-items:center}
.vol .piu18{position:absolute;left:6%;top:5%;z-index:1;font:400 max(12px,6cqw)/1 var(--fb);color:#fff;background:var(--marker-rosso);padding:.35em .4em;border-radius:50%;transform:rotate(12deg)}

/* il foglio sotto il puntatore viene in primo piano: i nuovi coprono i vecchi, ma basta passarci sopra
   (sul telefono toccarlo: lo script gli mette .sopra) per tirare fuori quello di sotto. Vale anche per i
   manifesti degli altri, che però non portano da nessuna parte */
.man{transition:transform .32s var(--eo),filter .32s var(--eo)}
.vol.sopra,.man.sopra,.vol:focus-within{z-index:20}
@media (hover:hover){
  .vol:hover,.man:hover{z-index:20}
  .vol:hover,.man:hover{transform:rotate(var(--pr)) translateY(calc(-1 * var(--u)))}
  .man:hover{filter:drop-shadow(0 4px 5px rgba(0,0,0,.3)) drop-shadow(0 18px 22px rgba(0,0,0,.34))}
  .vol:has(h3 a:hover){transform:rotate(var(--pr)) translateY(calc(-1.6 * var(--u))) scale(1.015);filter:drop-shadow(0 4px 5px rgba(0,0,0,.3)) drop-shadow(0 26px 30px rgba(0,0,0,.36))}
  .vol:has(h3 a:hover) h3{text-decoration:underline;text-decoration-thickness:.08em;text-underline-offset:.1em}
}
.vol:has(h3 a:active){transform:rotate(var(--pr)) scale(.99)}
.vol:has(h3 a:focus-visible){outline:3px solid #ffd400;outline-offset:4px}
.vol h3 a:focus-visible{outline:none}
/* un manifesto che è un link: l'<a> non ha scatola sua (l'immagine è assoluta), il fuoco si vede sul manifesto */
.man-link:focus-visible{outline:none}
.man-link:focus-visible>.man{outline:3px solid #ffd400;outline-offset:3px;z-index:20}

/* i tagliandi da strappare: fette della stessa carta, col contatto scritto di traverso.
   Il foglio con i tagliandi scrive fra i bordi veri della carta e i tagliandi vanno da bordo a bordo. */
.vol:has(.tagliandi) .testo{padding-left:var(--el);padding-right:var(--er)}
.vol:has(.tagliandi) .testo>*:not(.tagliandi){margin-left:5cqw;margin-right:5cqw}
.tagliandi{position:relative;z-index:2;display:flex;margin:auto 0 0;height:max(44px,17cqw);padding:0}
.tagliandi button{appearance:none;flex:1 1 0;min-width:0;margin:0;padding:0;border:0;border-top:1px dashed rgba(0,0,0,.45);border-left:1px dashed rgba(0,0,0,.4);background:var(--carta) var(--bgpos) / var(--bgsize) no-repeat;cursor:pointer;position:relative;color:var(--marker-c,var(--marker));font:400 max(9px,3.6cqw)/1 var(--fm);
  writing-mode:vertical-rl;text-align:center;transform-origin:50% 0;transition:transform .55s cubic-bezier(.55,0,1,.45),opacity .5s ease}
.tagliandi button:first-child{border-left:0}
.tagliandi button span{display:block;transform:rotate(180deg);padding:8px 0;white-space:nowrap;overflow:hidden;max-height:100%}
.tagliandi button.via{visibility:hidden;pointer-events:none}
.tagliandi button.cade{transform:translateY(60%) rotate(14deg);opacity:0}
.tagliandi button:focus-visible{outline:3px solid #ffd400;outline-offset:-3px}
@media (hover:hover){.tagliandi button:hover{transform:translateY(2px) rotate(-1.5deg)}}
.copiato{position:absolute;left:50%;bottom:14%;z-index:3;transform:translateX(-50%) rotate(-6deg);font:400 max(16px,9cqw)/1 var(--fm);color:var(--marker-rosso);background:rgba(255,255,255,.85);padding:.2em .4em;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .25s ease}
.copiato.si{opacity:1}

/* le carte: ogni volantino sa che foglio ha sotto, la sua proporzione, dove sono i bordi veri del foglio
   (dentro il ritaglio c'è anche il nastro) e il margine in cui scrivere */
.c-bianco{--carta:url(/art/carta/bianco.webp);--ar:560/732;--el:10%;--er:11.1%;--pad:16.1cqw 16.1cqw 12.9cqw 15.0cqw;--giu:8.9cqw}
.c-giallo{--carta:url(/art/carta/giallo.webp);--ar:556/672;--el:2.3%;--er:5%;--pad:14.9cqw 11.0cqw 11.7cqw 8.3cqw;--giu:7.7cqw}
.c-kraft{--carta:url(/art/carta/kraft.webp);--ar:504/656;--el:2.2%;--er:3.4%;--pad:7.8cqw 8.4cqw 7.4cqw 7.2cqw;--giu:3.4cqw}
.c-giornale{--carta:url(/art/carta/giornale.webp);--ar:600/524;--el:4.7%;--er:3.5%;--pad:8.4cqw 7.5cqw 7.5cqw 9.7cqw;--giu:3.5cqw}
.c-arancio{--carta:url(/art/carta/arancio.webp);--ar:520/636;--el:10.6%;--er:7.9%;--pad:14.4cqw 12.9cqw 13.7cqw 15.6cqw;--giu:9.7cqw}
.c-verde{--carta:url(/art/carta/verde.webp);--ar:596/556;--el:11.6%;--er:10.1%;--pad:14.3cqw 15.1cqw 11.6cqw 16.6cqw;--giu:8.6cqw}
.c-crema{--carta:url(/art/carta/crema.webp);--ar:588/648;--el:10.9%;--er:8.2%;--pad:14.5cqw 13.2cqw 12.2cqw 15.9cqw;--giu:8.2cqw}
.c-lucido{--carta:url(/art/carta/lucido.webp);--ar:516/600;--el:1.9%;--er:7.6%;--pad:8.7cqw 12.6cqw 10.6cqw 7.9cqw;--giu:6.6cqw}
.c-azzurro{--carta:url(/art/carta/azzurro.webp);--ar:652/576;--el:7.5%;--er:5.2%;--pad:12.7cqw 11.2cqw 7.5cqw 12.5cqw;--giu:3.5cqw}
.flip{--flip:-1}

/* ── sotto la saracinesca: la soglia di pietra ────────────────────────── */
.strada{padding-bottom:clamp(28px,4vw,56px)}

/* ── il telefono: il muro visto da vicino, due volantini per riga ─────────── */
@media (max-width:899px){
  :root{--u:calc(min(100cqw, 600px) / 390)}
  .parete{height:calc(3777 * var(--u));max-width:600px;margin:0 auto}
  .it{--px:var(--mx,var(--x));--py:var(--my,var(--y));--pw:var(--mw,var(--w));--pr:var(--mr,var(--r,0deg))}
  .spray{font-size:calc(40 * var(--u))}
  .vol h3{font-size:max(22px,16cqw)}
  .vol p{font-size:max(12px,5.6cqw)}
  .vol .handle{font-size:max(12px,6cqw)}
  .tagliandi{height:max(46px,17cqw)}
}

/* ── senza script la notte segue il tema del sistema (con lo script segue il tramonto di Mantova) ─ */
@media (prefers-color-scheme:dark){
  html:not(.js){--notte:1;--insegna:1;--lampioni:1}
}

@media (prefers-reduced-motion:reduce){
  .vol,.man,.tagliandi button,.copiato{transition:none}
  .tagliandi button.cade{transform:none;opacity:0}
}

/* ── auguri @~matti: il meme che si apre entrando, fino al 18.10.2026 alle 20:30 ── */
.auguri{width:min(88vw,520px);padding:0;border:0;background:none;overflow:visible}
.auguri::backdrop{background:rgba(10,10,10,.7)}
.auguri img{display:block;width:100%;height:auto;transform:rotate(-2deg);box-shadow:0 18px 50px rgba(0,0,0,.6)}
.auguri button{position:absolute;top:-14px;right:-14px;z-index:1;width:40px;height:40px;border:3px solid #fff;border-radius:50%;
  background:#111;color:#fff;font-family:var(--fb);font-size:26px;line-height:1;cursor:pointer}
.auguri[open]{animation:auguri .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes auguri{from{transform:scale(.6) rotate(6deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.auguri[open]{animation:none}}
/* 404: un muro corto */
.parete.p404{height:calc(640 * var(--u))}
@media (max-width:899px){.parete.p404{height:calc(720 * var(--u))}}
.p404 .vol .titolo{font-size:max(26px,15cqw)}
</style>
</head>
<body>
<!-- auguri a matti: si apre entrando fino al 18.10.2026 alle 20:30, poi lo script lo toglie da solo -->
<dialog class="auguri" aria-label="auguri @~matti">
  <form method="dialog"><button aria-label="chiudi">×</button></form>
  <img src="/art/auguri.webp" loading="lazy" alt="meme: torta con le candeline, «auguri @~matti, la torta la offri tu»" width="1024" height="1024">
</dialog>
<div class="strada">
  <header class="portale">
    <h1><span class="insegna-luce" aria-hidden="true"></span><img class="insegna" src="/art/insegna.svg" alt="pzkko" width="1080" height="450" fetchpriority="high"><img class="insegna notte" src="/art/insegna-notte.svg" alt="" aria-hidden="true" width="1080" height="450"><span class="insegna-cono" aria-hidden="true"></span></h1>
  </header>

  <main class="muro">
    <div class="parete p404">
      <img class="it tag" src="/art/tag/tag-nero.webp" alt="" width="444" height="372" style="--x:30;--y:40;--w:300;--r:-3deg;--mx:-10;--my:20;--mw:230;--mr:-6deg">
      <img class="it tag chiaro" src="/art/tag/throwup-argento.webp" alt="" width="441" height="375" style="--x:960;--y:420;--w:260;--r:-6deg;--mx:180;--my:520;--mw:200;--mr:-5deg">

  <img class="formica" src="/art/bestiole/formica.webp" alt="" width="276" height="356" loading="lazy">
  <img class="formica" src="/art/bestiole/formica.webp" alt="" width="276" height="356" loading="lazy">
  <img class="formica" src="/art/bestiole/formica-lato.webp" alt="" width="496" height="184" loading="lazy">
  <img class="formica" src="/art/bestiole/formica.webp" alt="" width="276" height="356" loading="lazy">
  <img class="formica" src="/art/bestiole/formica-lato.webp" alt="" width="496" height="184" loading="lazy">

  <span class="mosca" data-f="posata" aria-hidden="true"><img class="m-posata" src="/art/mosche/mosca.webp" alt="" width="158" height="166" style="--ax:80;--ay:72"><img class="m-zampe" src="/art/mosche/mosca-zampe.webp" alt="" width="154" height="182" style="--ax:75;--ay:92"><img class="m-vola" src="/art/mosche/mosca-vola.webp" alt="" width="192" height="135" style="--ax:94;--ay:64"><img class="m-vola2" src="/art/mosche/mosca-vola2.webp" alt="" width="118" height="149" style="--ax:56;--ay:78"></span>
  <span class="mosca" data-f="posata" aria-hidden="true"><img class="m-posata" src="/art/mosche/mosca.webp" alt="" width="158" height="166" style="--ax:80;--ay:72"><img class="m-zampe" src="/art/mosche/mosca-zampe.webp" alt="" width="154" height="182" style="--ax:75;--ay:92"><img class="m-vola" src="/art/mosche/mosca-vola.webp" alt="" width="192" height="135" style="--ax:94;--ay:64"><img class="m-vola2" src="/art/mosche/mosca-vola2.webp" alt="" width="118" height="149" style="--ax:56;--ay:78"></span>

<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)')
  const root = document.documentElement
  root.classList.add('js')

  // ── La sera a Mantova ────────────────────────────────────────────────────
  // Alba e tramonto si calcolano qui (equazione del tramonto, NOAA) per Mantova,
  // 45,156° N 10,791° E: nessuna chiamata in rete, vale per sempre. Il muro vive
  // a Mantova: la sera cala all'ora di lì, da qualunque posto si guardi.
  // Prove: ?ora=18:30 (ora di Mantova di oggi), ?veloce=60 (il tempo corre 60×), ?notte=1.
  const LAT = 45.1564, LON = 10.7914, RAD = Math.PI / 180, MIN = 60000
  // Calcolo NOAA (il foglio del Global Monitoring Laboratory), al minuto: per il
  // giorno UTC dell'istante chiesto, prima stima a mezzogiorno e poi tre giri
  // all'ora dell'evento. 90,833° = orizzonte con la rifrazione.
  const evento = (ms, tramonto) => {
    const giorno0 = Math.floor(ms / 86400000) * 86400000
    let t = giorno0 + 12 * 3600000
    for (let i = 0; i < 3; i++) {
      const T = (t / 86400000 + 2440587.5 - 2451545) / 36525
      const L0 = (((280.46646 + T * (36000.76983 + T * 0.0003032)) % 360) + 360) % 360
      const M = 357.52911 + T * (35999.05029 - 0.0001537 * T)
      const e = 0.016708634 - T * (0.000042037 + 0.0000001267 * T)
      const C = Math.sin(M * RAD) * (1.914602 - T * (0.004817 + 0.000014 * T)) + Math.sin(2 * M * RAD) * (0.019993 - 0.000101 * T) + Math.sin(3 * M * RAD) * 0.000289
      const om = 125.04 - 1934.136 * T, lam = L0 + C - 0.00569 - 0.00478 * Math.sin(om * RAD)
      const eps = 23 + (26 + (21.448 - T * (46.815 + T * (0.00059 - T * 0.001813))) / 60) / 60 + 0.00256 * Math.cos(om * RAD)
      const decl = Math.asin(Math.sin(eps * RAD) * Math.sin(lam * RAD))
      const y = Math.tan((eps / 2) * RAD) ** 2
      const eq = (4 / RAD) * (y * Math.sin(2 * L0 * RAD) - 2 * e * Math.sin(M * RAD) + 4 * e * y * Math.sin(M * RAD) * Math.cos(2 * L0 * RAD) - 0.5 * y * y * Math.sin(4 * L0 * RAD) - 1.25 * e * e * Math.sin(2 * M * RAD))
      const ha = Math.acos(Math.max(-1, Math.min(1, Math.cos(90.833 * RAD) / (Math.cos(LAT * RAD) * Math.cos(decl)) - Math.tan(LAT * RAD) * Math.tan(decl)))) / RAD
      t = giorno0 + (720 - 4 * LON - eq + (tramonto ? ha * 4 : -ha * 4)) * MIN
    }
    return t
  }
  const sole = (ms) => ({ alba: evento(ms, false), tramonto: evento(ms, true) })
  const q = new URLSearchParams(location.search)
  const veloce = Math.max(1, Number(q.get('veloce')) || 1)
  const partenza = Date.now()
  let inizio = partenza
  if (q.get('ora')) {
    // l'ora chiesta è quella di Mantova, oggi
    const [h, m] = q.get('ora').split(':').map(Number)
    const romaOra = new Date(new Date().toLocaleString('en-US', { timeZone: 'Europe/Rome' }))
    const scarto = Date.now() - romaOra.getTime()
    inizio = new Date(romaOra.getFullYear(), romaOra.getMonth(), romaOra.getDate(), h || 0, m || 0).getTime() + scarto
  }
  const adesso = () => inizio + (Date.now() - partenza) * veloce
  const liscia = (x) => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x) }

  // le tre grandezze della sera: il buio (0→1 da 40 min prima del tramonto a 50 dopo),
  // l'insegna (si accende al tramonto preciso) e i lampioni (12 minuti dopo); all'alba tutto a ritroso
  const fase = (t) => {
    const { alba, tramonto } = sole(t)
    if (q.get('notte') !== null) { const v = Math.max(0, Math.min(1, Number(q.get('notte')))); return { notte: v, insegna: v > 0 ? 1 : 0, lampioni: v > 0 ? 1 : 0 } }
    if (t < alba) return { notte: liscia((alba - t) / (60 * MIN)), insegna: 1, lampioni: t < alba - 10 * MIN ? 1 : 0 }
    if (t < tramonto - 40 * MIN) return { notte: 0, insegna: 0, lampioni: 0 }
    return { notte: liscia((t - (tramonto - 40 * MIN)) / (90 * MIN)), insegna: t >= tramonto ? 1 : 0, lampioni: t >= tramonto + 12 * MIN ? 1 : 0 }
  }

  // ── Lo sfarfallio delle luci al neon ─────────────────────────────────────
  // La rete a 50 Hz fa pulsare i tubi a 100 Hz: il browser disegna a 60, quindi
  // il campione cade ogni volta in un punto diverso dell'onda e ne esce il
  // tremolio tipico; sopra, ogni tanto, il tubo «sputa» (un calo breve e nervoso)
  // e all'accensione strobeggia qualche istante prima di tenere.
  const luce = (cali, accensione) => ({ f: 1, acceso: false, calo: 0, caloVal: 1, cali, accensione, t0: 0 })
  const insegna = luce(1 / 38, 1500), lampioni = luce(1 / 20, 1100)
  const campiona = (l, t, dt, stato) => {
    if (stato && !l.acceso) { l.acceso = true; l.t0 = t; l.calo = 0 }
    if (!stato) { l.acceso = false; return 0 }
    if (reduce.matches) return 1
    const da = t - l.t0
    if (da < l.accensione) {
      // strobo d'accensione: sempre più probabile che tenga
      const p = 0.12 + 0.88 * (da / l.accensione) ** 1.6
      return Math.random() < p ? 0.55 + 0.45 * Math.random() : 0.04
    }
    if (l.calo > 0) { l.calo -= dt; return l.caloVal * (0.6 + 0.4 * Math.random()) }
    if (Math.random() < l.cali * dt / 1000) { l.calo = 60 + 220 * Math.random(); l.caloVal = 0.35 + 0.35 * Math.random() }
    return 0.97 + 0.03 * Math.sin(2 * Math.PI * 100 * (t / 1000))
  }
  // ── Le auto che passano in strada ────────────────────────────────────────
  // Di notte, quando i lampioni sono accesi, ogni 20–90 secondi (mai più di tre
  // al minuto) passa un'auto: i fari (alogeni caldi, led freddi, xeno) spazzano
  // il muro e i fogli da un lato all'altro, poi dal lato in cui se ne va restano
  // i fanali rossi che sfumano, con una frenata ogni tanto; una su sette ha il
  // neon sotto la scocca. ?auto=1 ne fa passare una subito.
  const FARI = [['255,226,170', 1], ['214,230,255', 1], ['236,240,255', 1], ['255,214,150', 1], ['214,230,255', 1], ['255,226,170', 1]]
  let auto = null, prossimaAuto = q.get('auto') ? 0 : performance.now() + 8000 + Math.random() * 40000
  const set = (k, v) => root.style.setProperty(k, v)
  const passaAuto = (now) => {
    const [c] = FARI[Math.floor(Math.random() * FARI.length)]
    auto = { t0: now, durata: 1400 + Math.random() * 1400, verso: Math.random() < 0.5 ? 1 : -1, neon: Math.random() < 1 / 7, frena: Math.random() < 0.4 }
    set('--auto-c', c)
  }
  const animaAuto = (now) => {
    if (!auto) { if (now > prossimaAuto && !reduce.matches) passaAuto(now); return }
    const u = (now - auto.t0) / auto.durata
    if (u < 1) {
      const x = auto.verso > 0 ? -0.25 + 1.5 * u : 1.25 - 1.5 * u
      const l = Math.min(1, u / 0.22) * Math.min(1, (1 - u) / 0.28)
      set('--auto-x', x.toFixed(4)); set('--auto-l', (0.9 * l).toFixed(3)); set('--neon-auto', auto.neon ? (0.8 * l).toFixed(3) : 0)
      return
    }
    set('--auto-l', 0); set('--neon-auto', 0)
    const v = (now - auto.t0 - auto.durata) / 1700
    if (v < 1) {
      const frenata = auto.frena && v > 0.15 && v < 0.5 ? 0.35 : 0
      set('--freno-x', auto.verso > 0 ? 1.04 : -0.04); set('--freno', ((1 - v) * 0.8 + frenata).toFixed(3))
    } else { set('--freno', 0); auto = null; prossimaAuto = now + 20000 + Math.random() * 70000 }
  }

  let stato = { notte: 0, insegna: 0, lampioni: 0 }, prima = performance.now(), sfarfallioOn = false
  const sfarfallio = (now) => {
    const dt = Math.min(now - prima, 100)
    prima = now
    root.style.setProperty('--f-insegna', campiona(insegna, now, dt, stato.insegna > 0).toFixed(3))
    root.style.setProperty('--f-lampioni', campiona(lampioni, now, dt, stato.lampioni > 0).toFixed(3))
    if (stato.lampioni > 0) animaAuto(now)
    else if (auto) { auto = null; set('--auto-l', 0); set('--freno', 0); set('--neon-auto', 0) }
    if (stato.insegna > 0 || stato.lampioni > 0) requestAnimationFrame(sfarfallio)
    else sfarfallioOn = false
  }

  // ── La condensa dei condizionatori sul tetto ─────────────────────────────
  // I condizionatori stanno sopra il palazzo, fuori vista: ogni 3–9 secondi
  // una goccia cade dall'alto sulla lamiera, dove batte uno spruzzo; il rivolo
  // sotto è stampato sul muro.
  const strada = document.querySelector('.strada'), muro = document.querySelector('.muro')
  const rivolo = document.querySelector('.it.pezzo[src*="rivolo"]'), goccia = document.getElementById('goccia'), spruzzo = document.getElementById('spruzzo')
  const cade = () => {
    if (document.hidden || reduce.matches || !rivolo) return setTimeout(cade, 4000)
    const rs = strada.getBoundingClientRect(), rr = rivolo.getBoundingClientRect(), rm = muro.getBoundingClientRect()
    const x = rr.left + rr.width * 0.5 - rs.left - 4, y0 = -40, y1 = rm.top - rs.top + 4
    const durata = 420 + (y1 - y0) * 1.1
    goccia.animate([{ transform: `translate(${x}px, ${y0}px)`, opacity: 1 }, { transform: `translate(${x}px, ${y1}px)`, opacity: 1 }], { duration: durata, easing: 'cubic-bezier(.55,0,1,.6)' }).onfinish = () => {
      spruzzo.animate([{ transform: `translate(${x - 13}px, ${y1 - 10}px) scale(.4)`, opacity: .9 }, { transform: `translate(${x - 13}px, ${y1 - 12}px) scale(1)`, opacity: 0 }], { duration: 260, easing: 'ease-out' })
    }
    setTimeout(cade, 3000 + Math.random() * 6000)
  }
  setTimeout(cade, 2500)

  // ── Le formiche ──────────────────────────────────────────────────────────
  // Cinque formiche piccole lungo il bordo basso della lamiera: camminano, si
  // fermano, cambiano verso. Si muovono solo con la pagina in vista.
  const formiche = [...document.querySelectorAll('.formica')].map((el, i) => ({ el, x: 0, y: 0, dir: Math.random() < 0.5 ? 1 : -1, v: 12 + Math.random() * 18, pausa: 0, nata: false, lato: el.src.includes('lato') }))
  let tFormiche = performance.now()
  const camminano = (now) => {
    const dt = Math.min((now - tFormiche) / 1000, 0.1)
    tFormiche = now
    if (!document.hidden && !reduce.matches) {
      const rs = strada.getBoundingClientRect(), rm = muro.getBoundingClientRect()
      const x0 = rm.left - rs.left + 12, x1 = rm.right - rs.left - 12, yb = rm.bottom - rs.top - 16
      for (const fo of formiche) {
        if (!fo.nata) { fo.x = x0 + Math.random() * (x1 - x0); fo.y = yb - Math.random() * 40; fo.nata = true }
        if (fo.pausa > 0) { fo.pausa -= dt; continue }
        if (Math.random() < 0.004) { fo.pausa = 0.5 + Math.random() * 2; continue }
        if (Math.random() < 0.003) fo.dir = -fo.dir
        fo.x += fo.dir * fo.v * dt
        fo.y += (Math.random() - 0.5) * 6 * dt
        if (fo.x < x0) { fo.x = x0; fo.dir = 1 } else if (fo.x > x1) { fo.x = x1; fo.dir = -1 }
        if (fo.y < yb - 60) fo.y = yb - 60; else if (fo.y > yb) fo.y = yb
        const giro = fo.lato ? (fo.dir > 0 ? 'scaleX(1)' : 'scaleX(-1)') : `rotate(${fo.dir > 0 ? 90 : -90}deg)`
        fo.el.style.transform = `translate(${fo.x.toFixed(1)}px, ${fo.y.toFixed(1)}px) ${giro}`
      }
    }
    setTimeout(() => requestAnimationFrame(camminano), 80)
  }
  requestAnimationFrame(camminano)

  // ── Le mosche ────────────────────────────────────────────────────────────
  // Tre mosche, come le formiche ma in volo: posate stanno ferme, ogni tanto
  // si girano, fanno due passi o si puliscono le zampe; poi partono a zig zag
  // (cubiche con i punti di controllo a caso, più un tremolio di traverso),
  // passano da un punto o due e si posano altrove, dentro la parte di strada
  // che si vede. Se il puntatore si avvicina scappano. Con reduced-motion
  // restano posate dove sono nate.
  const K = 0.11 // la scala: il corpo nella foto è ~130 px, sul muro ~14
  const portale = document.querySelector('.portale')
  const mosche = [...document.querySelectorAll('.mosca')].map((el, n) => ({ el, n, x: 0, y: 0, a: Math.random() * 360, stato: 'nata', t: 0, f: 'posata' }))
  const caso = (a, b) => a + Math.random() * (b - a)
  const meta = () => {
    const rs = strada.getBoundingClientRect(), rp = portale.getBoundingClientRect()
    const y0 = Math.max(rp.bottom - rs.top - 30, -rs.top + 30), y1 = Math.max(y0 + 40, Math.min(rs.height - 30, innerHeight - rs.top - 30))
    return { x: caso(24, rs.width - 24), y: caso(y0, y1) }
  }
  const mostra = (m) => {
    m.el.dataset.f = m.f
    m.el.style.transform = `translate(${m.x.toFixed(1)}px, ${m.y.toFixed(1)}px) rotate(${m.a.toFixed(1)}deg) scale(${(m.stato === 'vola' ? K * 1.12 : K).toFixed(3)})`
  }
  const posa = (m) => { m.stato = 'posata'; m.f = 'posata'; m.el.classList.remove('vola'); m.t = caso(1.5, 9) }
  const parti = (m, via) => {
    const punti = [{ x: m.x, y: m.y }]
    if (via) punti.push({ x: m.x + via.x, y: m.y + via.y })
    const n = Math.random() < 0.5 ? 1 : 2 + Math.floor(Math.random() * 2)
    for (let i = 0; i < n; i++) punti.push(meta())
    m.tratti = []
    for (let i = 1; i < punti.length; i++) {
      const p0 = punti[i - 1], p3 = punti[i], d = Math.hypot(p3.x - p0.x, p3.y - p0.y)
      const c = (p) => ({ x: p.x + caso(-0.6, 0.6) * d, y: p.y + caso(-0.6, 0.6) * d })
      m.tratti.push({ p0, p1: c(p0), p2: c(p3), p3, dur: Math.max(0.3, d / caso(260, 520)) })
    }
    m.pulisce = 0; m.gira = 0; m.passi = 0
    m.stato = 'vola'; m.el.classList.add('vola'); m.i = 0; m.u = 0; m.fase = Math.random() * 9
  }
  const bez = (t, a, b, c, d) => { const s = 1 - t; return s * s * s * a + 3 * s * s * t * b + 3 * s * t * t * c + t * t * t * d }
  let tMosche = performance.now()
  const volano = (now) => {
    const dt = Math.min((now - tMosche) / 1000, 0.05)
    tMosche = now
    if (!document.hidden) for (const m of mosche) {
      if (m.stato === 'nata') { Object.assign(m, meta()); posa(m); m.t = caso(0.5, 6); mostra(m); continue }
      if (reduce.matches) continue
      if (m.stato === 'posata') {
        m.t -= dt
        if (m.pulisce > 0) { m.pulisce -= dt; m.f = m.pulisce > 0 && Math.floor(now / 140) % 2 ? 'zampe' : 'posata'; mostra(m) }
        if (m.gira) { const passo = Math.sign(m.gira) * Math.min(Math.abs(m.gira), 400 * dt); m.a += passo; m.gira -= passo; mostra(m) }
        if (m.passi > 0) { const r = (m.a - 90) * Math.PI / 180, v = 22 * dt; m.x += Math.cos(r) * v; m.y += Math.sin(r) * v; m.passi -= v; mostra(m) }
        if (m.t <= 0) {
          const r = Math.random()
          if (r < 0.35) parti(m)
          else if (r < 0.6) { m.pulisce = caso(0.8, 2.2); m.t = m.pulisce + caso(0.4, 3) }
          else if (r < 0.8) { m.gira = caso(25, 120) * (Math.random() < 0.5 ? -1 : 1); m.t = caso(0.6, 4) }
          else { m.passi = caso(3, 12); m.t = caso(0.6, 3) }
        }
        continue
      }
      // in volo
      m.u += dt / m.tratti[m.i].dur
      if (m.u >= 1) {
        m.i++; m.u = 0
        if (m.i >= m.tratti.length) { const fine = m.tratti.at(-1).p3; m.x = fine.x; m.y = fine.y; posa(m); m.a += caso(-40, 40); mostra(m); continue }
      }
      const t = m.tratti[m.i], u = m.u
      const x = bez(u, t.p0.x, t.p1.x, t.p2.x, t.p3.x), y = bez(u, t.p0.y, t.p1.y, t.p2.y, t.p3.y)
      const dx = x - m.x, dy = y - m.y
      m.fase += dt * 23
      const tremo = Math.sin(m.fase) * 2.2 + Math.sin(m.fase * 2.7) * 1.3, l = Math.hypot(dx, dy) || 1
      m.x = x - (dy / l) * tremo; m.y = y + (dx / l) * tremo
      if (l > 0.2) m.a = Math.atan2(dy, dx) * 180 / Math.PI + 90
      m.f = (Math.floor(now / 28) + m.n) % 2 ? 'vola' : 'vola2'
      mostra(m)
    }
    requestAnimationFrame(volano)
  }
  requestAnimationFrame(volano)
  // il puntatore che si avvicina le fa scappare
  addEventListener('pointermove', (e) => {
    if (reduce.matches) return
    const rs = strada.getBoundingClientRect(), px = e.clientX - rs.left, py = e.clientY - rs.top
    for (const m of mosche) {
      const d = Math.hypot(m.x - px, m.y - py)
      if (m.stato === 'posata' && d < 70) parti(m, { x: ((m.x - px) / (d || 1)) * 140, y: ((m.y - py) / (d || 1)) * 140 })
    }
  }, { passive: true })
  const aggiorna = () => {
    stato = fase(adesso())
    root.style.setProperty('--notte', stato.notte.toFixed(3))
    root.style.setProperty('--insegna', stato.insegna)
    root.style.setProperty('--lampioni', stato.lampioni)
    if ((stato.insegna > 0 || stato.lampioni > 0) && !sfarfallioOn) { sfarfallioOn = true; prima = performance.now(); requestAnimationFrame(sfarfallio) }
  }
  // all'apertura le luci già accese non strobeggiano: sono accese da un pezzo
  { const f0 = fase(adesso()); if (f0.insegna) { insegna.acceso = true; insegna.t0 = -1e9 } if (f0.lampioni) { lampioni.acceso = true; lampioni.t0 = -1e9 } }
  aggiorna()
  setInterval(aggiorna, veloce > 1 ? 250 : 1000)
  document.addEventListener('visibilitychange', () => { if (!document.hidden) aggiorna() })

  // I giochi: la roulette e il blackjack, ognuno in una finestra sopra il muro
  // (games/<gioco>/). Il codice e il 3D si caricano solo quando si apre (o quando
  // il puntatore passa sul volantino); #roulette o #blackjack nell'indirizzo li apre subito.
  const GIOCHI = {
    roulette: ['roulette.js', 'ruota.js', 'regole.js', 'lib/three.js'].map((f) => `/games/roulette/${f}`),
    blackjack: ['blackjack.js', 'regole.js', 'scena.js', 'carte.js', '../pzk.js', '../roulette/lib/three.js'].map((f) => new URL(f, `${location.origin}/games/blackjack/`).pathname),
  }
  const apriGioco = (nome) => import(`/games/${nome}/${nome}.js`).then((m) => m.apri())
  for (const gioco of document.querySelectorAll('a[data-gioco]')) {
    const nome = gioco.dataset.gioco
    if (!GIOCHI[nome]) continue
    gioco.addEventListener('click', (e) => { e.preventDefault(); history.replaceState(null, '', `#${nome}`); apriGioco(nome) })
    gioco.addEventListener('pointerenter', () => {
      for (const f of GIOCHI[nome]) {
        if (document.querySelector(`link[href="${f}"]`)) continue
        const l = document.createElement('link')
        l.rel = 'modulepreload'; l.href = f
        document.head.appendChild(l)
      }
    }, { once: true })
  }
  const nel = location.hash.slice(1)
  if (GIOCHI[nel]) apriGioco(nel)

  // Sul telefono non c'è il passaggio del puntatore: toccare un foglio o un
  // manifesto lo porta in primo piano (resta su finché non se ne tocca un altro).
  let sopra = null
  document.querySelector('.parete').addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse') return
    const el = e.target.closest('.vol, .man')
    if (!el || el === sopra) return
    sopra?.classList.remove('sopra')
    el.classList.add('sopra')
    sopra = el
  }, { passive: true })

  // I tagliandi sono fette della carta del volantino: ognuno mostra il pezzo di
  // foglio che gli tocca (stessa immagine, spostata), così quando si strappa
  // resta il buco col muro dietro.
  const fette = () => {
    for (const t of document.querySelectorAll('.tagliandi')) {
      const vol = t.closest('.vol')
      const r = vol.getBoundingClientRect()
      const rt = t.getBoundingClientRect()
      const btns = [...t.querySelectorAll('button')]
      const flip = getComputedStyle(vol).getPropertyValue('--flip').trim() === '-1'
      btns.forEach((b, i) => {
        const rb = b.getBoundingClientRect()
        // posizione del tagliando rispetto al foglio, senza la rotazione (rapporti, non pixel)
        const w = r.width, h = r.height
        b.style.setProperty('--bgsize', `${(w / rb.width) * 100}% ${(h / rb.height) * 100}%`)
        const ox = flip ? (r.right - rb.right) : (rb.left - r.left)
        const px = ox / (w - rb.width) * 100
        const py = (rb.top - r.top) / (h - rb.height) * 100
        b.style.setProperty('--bgpos', `${px}% ${py}%`)
        if (flip) b.style.transform = ''
      })
      void rt
    }
  }
  // il calcolo usa i rettangoli non ruotati: si misura col volantino dritto
  const misura = () => {
    const vols = [...document.querySelectorAll('.vol')]
    for (const v of vols) v.style.transform = 'none'
    fette()
    for (const v of vols) v.style.transform = ''
  }
  misura()
  addEventListener('resize', misura)
  document.fonts?.ready.then(misura)

  // strappare un tagliando copia il contatto
  let nota
  const copia = async (t, b) => {
    const testo = t.dataset.copia
    let ok = false
    try { await navigator.clipboard.writeText(testo); ok = true } catch {}
    const vol = t.closest('.vol')
    nota?.remove()
    nota = document.createElement('span')
    nota.className = 'copiato'
    nota.textContent = ok ? `copiato: ${testo}` : testo
    vol.appendChild(nota)
    requestAnimationFrame(() => nota.classList.add('si'))
    setTimeout(() => nota?.classList.remove('si'), 2600)
    const fine = () => { b.classList.add('via'); b.classList.remove('cade'); b.setAttribute('aria-disabled', 'true') }
    if (reduce.matches) fine()
    else { b.classList.add('cade'); b.addEventListener('transitionend', fine, { once: true }); setTimeout(fine, 700) }
    const vivi = t.querySelectorAll('button:not(.via)').length
    if (vivi === 0) setTimeout(() => { for (const x of t.querySelectorAll('button')) { x.classList.remove('via'); x.removeAttribute('aria-disabled') } }, 1800)
  }
  for (const t of document.querySelectorAll('.tagliandi')) {
    t.setAttribute('role', 'group')
    t.setAttribute('aria-label', `tagliandi da strappare: copiano ${t.dataset.nome}`)
    for (const b of t.querySelectorAll('button')) {
      b.setAttribute('aria-label', `strappa un tagliando e copia ${t.dataset.nome}`)
      b.addEventListener('click', () => { if (!b.classList.contains('via')) copia(t, b) })
    }
  }

  // ── auguri @~matti: 24 ore e poi sparisce ────────────────────────────────
  // L'immagine è lazy dentro il dialog chiuso: dopo la scadenza non si scarica nemmeno.
  const auguri = document.querySelector('.auguri')
  if (auguri && Date.now() < Date.parse('2026-10-18T20:30:00+02:00')) {
    const img = auguri.querySelector('img')
    auguri.showModal()
    auguri.addEventListener('click', (e) => { if (e.target === auguri || e.target === img) auguri.close() })
  } else auguri?.remove()
})()
</script>
<!-- La scena 3D (scena/): sui computer con WebGL2 la saracinesca diventa una strada vera, disegnata dalla
     scheda grafica con luci, ombre e riflessi; questa pagina resta sotto, invisibile, a fare tutto il resto.
     ?muro=1 la tiene com'è; sotto i 900 px resta il muro di sempre. -->
<script>
(() => {
  const q = new URLSearchParams(location.search)
  if (q.get('muro') !== null || innerWidth < 900) return
  if (!document.createElement('canvas').getContext('webgl2')) return
  const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = '/scena/scena.css'; document.head.appendChild(l)
  import('/scena/scena.js').then((m) => m.avvia()).catch((e) => console.warn('scena 3D non partita', e))
})()
</script>
