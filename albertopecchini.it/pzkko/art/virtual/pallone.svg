<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420">
  <!-- l'illustrazione del volantino «virtual»: un pallone a pixel grossi davanti a uno schermino, solo inchiostro
       (si stampa sulla carta in multiply come le altre illustrazioni). Disegnato a mano in SVG, non da un modello. -->
  <defs>
    <filter id="g" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/></filter>
  </defs>
  <g fill="#161616" filter="url(#g)">
    <!-- la cornice dello schermino, tipo tamagotchi -->
    <path d="M46 70 q0-22 22-22 h284 q22 0 22 22 v212 q0 22-22 22 h-284 q-22 0-22-22z M68 78 v196 h284 v-196z" fill-rule="evenodd"/>
    <!-- le righe di scansione dello schermo -->
    <g opacity=".9">
      <rect x="76" y="92" width="268" height="4"/><rect x="76" y="112" width="268" height="4"/><rect x="76" y="132" width="268" height="4"/>
      <rect x="76" y="152" width="268" height="4"/><rect x="76" y="172" width="268" height="4"/><rect x="76" y="192" width="268" height="4"/>
      <rect x="76" y="212" width="268" height="4"/><rect x="76" y="232" width="268" height="4"/><rect x="76" y="252" width="268" height="4"/>
    </g>
    <!-- il campo a pixel sullo schermo: le righe e le due porte -->
    <rect x="84" y="100" width="252" height="6"/><rect x="84" y="262" width="252" height="6"/>
    <rect x="84" y="100" width="6" height="168"/><rect x="330" y="100" width="6" height="168"/><rect x="207" y="100" width="6" height="168"/>
    <rect x="84" y="160" width="20" height="48"/><rect x="316" y="160" width="20" height="48"/>
    <!-- due omini a pixel -->
    <g><rect x="140" y="130" width="10" height="10"/><rect x="135" y="140" width="20" height="18"/><rect x="135" y="158" width="8" height="14"/><rect x="147" y="158" width="8" height="14"/></g>
    <g><rect x="268" y="196" width="10" height="10"/><rect x="263" y="206" width="20" height="18"/><rect x="263" y="224" width="8" height="14"/><rect x="275" y="224" width="8" height="14"/></g>
    <!-- i tasti sotto lo schermino -->
    <circle cx="150" cy="332" r="14"/><circle cx="210" cy="340" r="14"/><circle cx="270" cy="332" r="14"/>
    <!-- il pallone grande a pixel, davanti, in basso a destra -->
    <g transform="translate(236 230)">
      <rect x="44" y="0" width="56" height="14"/><rect x="24" y="14" width="96" height="14"/><rect x="12" y="28" width="120" height="14"/>
      <rect x="0" y="42" width="144" height="56"/><rect x="12" y="98" width="120" height="14"/><rect x="24" y="112" width="96" height="14"/><rect x="44" y="126" width="56" height="14"/>
    </g>
  </g>
  <!-- le pezze bianche del pallone (i buchi nell'inchiostro) -->
  <g fill="#fff" transform="translate(236 230)">
    <rect x="58" y="14" width="28" height="14"/><rect x="30" y="42" width="24" height="24"/><rect x="92" y="42" width="24" height="24"/>
    <rect x="58" y="70" width="28" height="28"/><rect x="24" y="84" width="14" height="14"/><rect x="106" y="84" width="14" height="14"/><rect x="44" y="112" width="20" height="14"/><rect x="82" y="112" width="20" height="14"/>
  </g>
</svg>
