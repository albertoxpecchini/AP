<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="450" viewBox="0 0 1080 450">
  <!-- L'insegna di notte: solo quello che si accende, da sovrapporre a insegna.svg (stessa tela).
       Dentro ogni lettera il tubo al neon, bianco caldo, a metà del tratto (come in scena/lettere.js);
       la faccia di metacrilato si scalda intorno al tubo, più chiara vicino, e la luce si allarga appena
       sul pannello. Il bordino resta scuro, ai capi del tubo gli elettrodi. -->
  <defs>
    <!-- «pzkko» e i suoi tubi, come in insegna.svg -->
    <g id="parola" fill-rule="evenodd">
      <path d="M0 50A51 51 0 1 1 29.5 96.25V152H0ZM29.5 50A21.5 21.5 0 1 0 72.5 50A21.5 21.5 0 1 0 29.5 50Z"/>
      <path transform="translate(108 0)" d="M0 0H86V29L42 71H86V100H0V71L44 29H0Z"/>
      <path transform="translate(203 0)" d="M0-58H30V16L46 0H88L38 50L88 100H45L30 85V100H0Z"/>
      <path transform="translate(298 0)" d="M0-58H30V16L46 0H88L38 50L88 100H45L30 85V100H0Z"/>
      <path transform="translate(391 0)" d="M0 50A51 51 0 1 0 102 50A51 51 0 1 0 0 50ZM29.5 50A21.5 21.5 0 1 1 72.5 50A21.5 21.5 0 1 1 29.5 50Z"/>
    </g>
    <g id="tubi" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.75 134V50A36.25 36.25 0 1 1 27.7 77.8"/>
      <path transform="translate(108 0)" d="M18 14.5H80.2L5.8 85.5H68"/>
      <path transform="translate(203 0)" d="M15 84V-40M54 16L25 50L54 84"/>
      <path transform="translate(298 0)" d="M15 84V-40M54 16L25 50L54 84"/>
      <path transform="translate(391 0)" d="M30.2 79.7A36.25 36.25 0 1 1 47.8 86.1"/>
    </g>
    <filter id="alone" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="alone2" x="-10%" y="-20%" width="120%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="faccia" x="-5%" y="-10%" width="110%" height="120%"><feGaussianBlur stdDeviation="4.5"/></filter>
    <filter id="tubo" x="-5%" y="-10%" width="110%" height="120%"><feGaussianBlur stdDeviation="1.8"/></filter>
    <mask id="m-parola"><use href="#parola" xlink:href="#parola" fill="#fff"/></mask>
    <clipPath id="c-pannello"><rect x="46" y="36" width="988" height="328"/></clipPath>
  </defs>
  <g clip-path="url(#c-pannello)">
    <g transform="translate(268.85 148.3) scale(1.1)">
      <!-- la luce sul pannello -->
      <use href="#tubi" xlink:href="#tubi" stroke="#ffbe6a" stroke-width="90" opacity=".3" filter="url(#alone)"/>
      <use href="#parola" xlink:href="#parola" fill="#ffd79a" opacity=".35" filter="url(#alone2)"/>
      <!-- la faccia: calda, più chiara verso il tubo -->
      <g mask="url(#m-parola)">
        <use href="#parola" xlink:href="#parola" fill="#c99a62"/>
        <use href="#tubi" xlink:href="#tubi" stroke="#ffd9a0" stroke-width="30" filter="url(#faccia)"/>
      </g>
      <!-- il tubo: il vetro e la luce dentro, e gli elettrodi ai capi -->
      <use href="#tubi" xlink:href="#tubi" stroke="#fff3dc" stroke-width="11" filter="url(#tubo)"/>
      <use href="#tubi" xlink:href="#tubi" stroke="#fffdf6" stroke-width="5"/>
      <g fill="#2b2622" opacity=".75">
        <circle cx="14.75" cy="134" r="2.6"/><circle cx="27.7" cy="77.8" r="2.6"/>
        <circle cx="126" cy="14.5" r="2.6"/><circle cx="176" cy="85.5" r="2.6"/>
        <circle cx="218" cy="84" r="2.6"/><circle cx="218" cy="-40" r="2.6"/><circle cx="257" cy="16" r="2.6"/><circle cx="257" cy="84" r="2.6"/>
        <circle cx="313" cy="84" r="2.6"/><circle cx="313" cy="-40" r="2.6"/><circle cx="352" cy="16" r="2.6"/><circle cx="352" cy="84" r="2.6"/>
        <circle cx="421.2" cy="79.7" r="2.6"/><circle cx="438.8" cy="86.1" r="2.6"/>
      </g>
      <use href="#parola" xlink:href="#parola" fill="none" stroke="#3e3a35" stroke-width="2.2"/>
    </g>
  </g>
</svg>
