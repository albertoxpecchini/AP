<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>il banco di pzkko</title>
<meta name="robots" content="noindex, nofollow">
<meta name="author" content="Alberto Pecchini">
<link rel="author" href="https://www.albertopecchini.it">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#fff; --tile:#f5f5f7; --fg:#1d1d1f; --fg2:#6e6e73; --link:#0066cc; --hair:rgba(0,0,0,.1); --nav:rgba(255,255,255,.72); --ok:#248a3d; --no:#d70015; --btn:#0066cc; --campo:#fff;
  --fd:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --ft:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --eo:cubic-bezier(.23,1,.32,1);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{--bg:#000;--tile:#1d1d1f;--fg:#f5f5f7;--fg2:#a1a1a6;--link:#2997ff;--hair:rgba(255,255,255,.14);--nav:rgba(0,0,0,.62);--ok:#30d158;--no:#ff6961;--btn:#1a6fe0;--campo:#2c2c2e}}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100svh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:400 17px/1.47 var(--ft);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--link);outline-offset:3px;border-radius:10px}
h1,h2,p,ul{margin:0}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
.n{font-variant-numeric:tabular-nums}
.wrap{width:100%;max-width:1024px;margin:0 auto;padding:0 22px}
main{flex:1}
.nav{position:sticky;top:0;z-index:10;height:48px;background:var(--nav);-webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8)}
.nav .wrap{height:100%;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font:600 17px/1 var(--fd);letter-spacing:-.02em}
.brand span{font-weight:400;color:var(--fg2)}
.nav a.go{font-size:13px;color:var(--link)}
.griglia{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;padding:16px 0 48px}
.scheda{padding:22px;border-radius:28px;background:var(--tile)}
.scheda.larga{grid-column:1/-1}
.scheda h2{font:600 20px/1.2 var(--fd);letter-spacing:-.02em;margin-bottom:12px}
.scheda p{color:var(--fg2);font-size:15px}
.riga{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.riga+.riga{margin-top:10px}
input{height:44px;padding:0 14px;border:0;border-radius:12px;background:var(--campo);box-shadow:inset 0 0 0 1px var(--hair);font-size:16px;min-width:0;text-transform:none}
input::placeholder{color:var(--fg2)}
input.corto{width:110px}
.b{height:44px;padding:0 16px;border:0;border-radius:999px;background:var(--campo);box-shadow:inset 0 0 0 1px var(--hair);cursor:pointer;font-weight:600;font-size:15px;transition:transform .12s var(--eo)}
.b.p{background:var(--btn);color:#fff;box-shadow:none}
.b.s{height:34px;padding:0 12px;font-size:13px}
.b.no{color:var(--no)}
.b:active{transform:scale(.96)}
.b:disabled{opacity:.4;cursor:default}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{text-align:left;padding:10px 8px 10px 0;border-top:1px solid var(--hair);vertical-align:middle}
th{font-weight:600;font-size:13px;color:var(--fg2);border-top:0}
td .nome{font-weight:600}
td .sotto{display:block;font-size:12px;color:var(--fg2)}
.cod{font-size:12px;color:var(--fg2);letter-spacing:.04em;text-transform:none}
.azioni{display:flex;flex-wrap:wrap;gap:6px}
.msg{margin-top:12px;font-size:14px;color:var(--fg2);min-height:1.4em}
.msg.no{color:var(--no)}
.msg.ok{color:var(--ok)}
.reg{list-style:none;padding:0;font-size:14px;color:var(--fg2);display:flex;flex-direction:column;gap:6px}
.reg li{display:flex;gap:10px}
.reg time{flex:none;font-size:12px;padding-top:2px}
.stato{font-size:15px;color:var(--fg2)}
.stato b{color:var(--fg);font-weight:600}
.foot{border-top:1px solid var(--hair);padding:22px 0 max(22px,env(safe-area-inset-bottom));font-size:12px;color:var(--fg2)}
.foot .wrap{display:flex;justify-content:space-between;gap:12px 16px;flex-wrap:wrap}
@media (max-width:640px){.wrap{padding:0 16px}.scheda{padding:20px 18px;border-radius:24px}td,th{padding-right:6px}table{font-size:14px}}
</style>
</head>
<body>
<header class="nav">
  <div class="wrap">
    <a class="brand" href="/games/blackjack/">pzkko <span>il banco</span></a>
    <a class="go" href="/games/blackjack/">al tavolo</a>
  </div>
</header>

<main class="wrap">
  <div class="griglia">
    <section class="scheda" id="s-chiave">
      <h2>la chiave del banco</h2>
      <p>la stessa BJ_ADMIN_KEY impostata su Vercel. resta solo in questa scheda del browser.</p>
      <form class="riga" id="f-chiave" style="margin-top:12px">
        <input name="key" type="password" placeholder="chiave" autocomplete="current-password" required style="flex:1">
        <button class="b p" type="submit">apri</button>
      </form>
      <p class="msg" id="m-chiave"></p>
    </section>

    <section class="scheda larga" id="s-stato" hidden>
      <h2>il tavolo adesso</h2>
      <p class="stato" id="stato"></p>
      <div class="riga" style="margin-top:12px">
        <form class="riga" id="f-msg" style="flex:1 1 320px"><input name="testo" placeholder="un messaggio al tavolo" maxlength="140" style="flex:1"><button class="b" type="submit">dillo</button></form>
        <button class="b no" type="button" data-cmd="azzera">azzera il tavolo</button>
        <button class="b" type="button" data-cmd="chiudi">chiudi la sessione</button>
      </div>
      <p class="msg" id="m-stato"></p>
    </section>

    <section class="scheda larga" id="s-giocatori" hidden>
      <h2>i giocatori e i loro $pzk</h2>
      <table class="n" id="t-giocatori"><thead><tr><th>chi</th><th>$pzk</th><th>mani</th><th>netto</th><th></th></tr></thead><tbody></tbody></table>
      <form class="riga" id="f-nuovo" style="margin-top:16px">
        <input name="nome" placeholder="nome nuovo" maxlength="14" required>
        <input name="quanti" class="corto n" type="number" inputmode="numeric" min="0" step="1" placeholder="$pzk" value="500">
        <button class="b" type="submit">registra un amico</button>
      </form>
      <p class="msg" id="m-giocatori"></p>
    </section>

    <section class="scheda" id="s-config" hidden>
      <h2>regole del banco</h2>
      <form class="riga" id="f-benvenuto"><label>benvenuto</label><input name="quanti" class="corto n" type="number" min="0" step="1" required><button class="b s" type="submit">imposta</button></form>
      <form class="riga" id="f-limiti"><label>puntate</label><input name="min" class="corto n" type="number" min="1" step="1" required><input name="max" class="corto n" type="number" min="1" step="1" required><button class="b s" type="submit">imposta</button></form>
      <form class="riga" id="f-tempi"><label>secondi</label><input name="puntate" class="corto n" type="number" min="5" max="120" step="1" required><input name="decisione" class="corto n" type="number" min="5" max="120" step="1" required><button class="b s" type="submit">imposta</button></form>
      <p class="msg" id="m-config"></p>
    </section>

    <section class="scheda" id="s-registro" hidden>
      <h2>registro</h2>
      <ul class="reg n" id="registro"></ul>
    </section>
  </div>
</main>

<footer class="foot">
  <div class="wrap">
    <a href="https://www.albertopecchini.it" rel="author">sito di alberto pecchini</a>
    <span>pzkko.it</span>
  </div>
</footer>

<script>
(() => {
  'use strict'
  const API = '/api/blackjack/'
  const $ = (id) => document.getElementById(id)
  const fmt = (n) => Math.trunc(Number(n) || 0).toLocaleString('it-IT')
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
  const ora = (t) => new Date(t).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' })
  let key = ''
  try { key = sessionStorage.getItem('bj-key') || '' } catch {}
  let priv = null
  let pub = null
  let timer = 0

  function msg(id, testo, tipo) {
    const m = $(id)
    m.textContent = testo || ''
    m.className = `msg${tipo ? ' ' + tipo : ''}`
  }

  async function ammin(cmd, extra = {}, dove = 'm-stato') {
    try {
      const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ a: 'ammin', key, cmd, ...extra }) })
      const j = await r.json()
      if (!j.ok) { msg(dove, j.error || 'no', 'no'); return null }
      priv = j.privato
      pub = j
      if (j.esito) msg(dove, j.esito, 'ok')
      render()
      return j
    } catch {
      msg(dove, 'non riesco a parlare col tavolo', 'no')
      return null
    }
  }

  function render() {
    for (const id of ['s-stato', 's-giocatori', 's-config', 's-registro']) $(id).hidden = !priv
    $('s-chiave').hidden = Boolean(priv)
    if (!priv) return
    const resta = pub.fine ? Math.max(0, Math.round((pub.fine - pub.now) / 1000)) : null
    const seduti = pub.posti.filter(Boolean)
    $('stato').innerHTML = `mano <b class="n">${pub.mano}</b> · fase <b>${pub.fase}</b>${resta !== null ? ` (<span class="n">${resta}</span> s)` : ''} · seduti <b class="n">${seduti.length}</b>/5 · in linea <b class="n">${pub.giocatori.filter((g) => g.online).length}</b> · sabot <span class="n">${pub.sabot.carte}</span> carte · benvenuto <span class="n">${fmt(priv.config.benvenuto)}</span> · puntate <span class="n">${fmt(priv.config.min)}–${fmt(priv.config.max)}</span>`
    const tb = $('t-giocatori').querySelector('tbody')
    tb.innerHTML = priv.giocatori.length
      ? priv.giocatori.map((g) => `<tr data-id="${g.id}"><td><span class="nome">${esc(g.nome)}</span><span class="sotto">${g.posto !== null ? `posto ${g.posto + 1}` : 'in piedi'} · ${Date.now() - g.visto < 60000 ? 'in linea' : 'visto ' + ora(g.visto)}</span><span class="sotto cod">${g.tok} <button class="b s" type="button" data-copia="${g.tok}" title="copia il codice">copia</button></span></td><td>${fmt(g.pzk)}</td><td>${g.stat.mani} <span class="sotto">+${g.stat.vinte} −${g.stat.perse} =${g.stat.pari}</span></td><td>${g.stat.netto > 0 ? '+' : ''}${fmt(g.stat.netto)}</td><td><div class="azioni"><button class="b s" type="button" data-dai="100">+100</button><button class="b s" type="button" data-dai="500">+500</button><button class="b s" type="button" data-quanti>imposta…</button>${g.posto !== null ? '<button class="b s" type="button" data-espelli>fai alzare</button>' : ''}<button class="b s no" type="button" data-elimina>cancella</button></div></td></tr>`).join('')
      : '<tr><td colspan="5">nessun giocatore ancora.</td></tr>'
    $('f-benvenuto').quanti.value = priv.config.benvenuto
    $('f-limiti').min.value = priv.config.min
    $('f-limiti').max.value = priv.config.max
    $('f-tempi').puntate.value = priv.config.tPuntate / 1000
    $('f-tempi').decisione.value = priv.config.tDecisione / 1000
    $('registro').innerHTML = priv.registro.length ? priv.registro.slice().reverse().slice(0, 20).map((r) => `<li><time>${ora(r.t)}</time><span>${esc(r.testo)}</span></li>`).join('') : '<li>niente ancora.</li>'
  }

  $('f-chiave').addEventListener('submit', async (e) => {
    e.preventDefault()
    key = e.target.key.value.trim()
    const j = await ammin('elenco', {}, 'm-chiave')
    if (j) { try { sessionStorage.setItem('bj-key', key) } catch {} ; avvia() }
  })

  $('t-giocatori').addEventListener('click', async (e) => {
    const b = e.target.closest('button')
    if (!b) return
    const tr = b.closest('tr')
    const chi = tr && tr.dataset.id
    const nome = tr ? tr.querySelector('.nome').textContent : ''
    if (b.dataset.copia) { try { await navigator.clipboard.writeText(`entra su https://www.pzkko.it/games/blackjack/ col codice ${b.dataset.copia}`); msg('m-giocatori', `codice di ${nome} copiato, con l'indirizzo del tavolo`, 'ok') } catch { msg('m-giocatori', b.dataset.copia) } return }
    if (b.dataset.dai) return ammin('dai', { chi, quanti: Number(b.dataset.dai) }, 'm-giocatori')
    if (b.dataset.quanti !== undefined) { const v = prompt(`$pzk di ${nome}:`); if (v !== null && v.trim() !== '') ammin('imposta', { chi, quanti: Number(v) }, 'm-giocatori'); return }
    if (b.dataset.espelli !== undefined) return ammin('espelli', { chi }, 'm-giocatori')
    if (b.dataset.elimina !== undefined) { if (confirm(`cancellare ${nome}? i suoi $pzk spariscono.`)) ammin('elimina', { chi }, 'm-giocatori') }
  })

  $('f-nuovo').addEventListener('submit', async (e) => {
    e.preventDefault()
    const j = await ammin('nuovo', { nome: e.target.nome.value, quanti: Number(e.target.quanti.value || 0) }, 'm-giocatori')
    if (j) e.target.nome.value = ''
  })
  $('f-msg').addEventListener('submit', async (e) => { e.preventDefault(); const j = await ammin('messaggio', { testo: e.target.testo.value }); if (j) e.target.testo.value = '' })
  $('f-benvenuto').addEventListener('submit', (e) => { e.preventDefault(); ammin('benvenuto', { quanti: Number(e.target.quanti.value) }, 'm-config') })
  $('f-limiti').addEventListener('submit', (e) => { e.preventDefault(); ammin('limiti', { min: Number(e.target.min.value), max: Number(e.target.max.value) }, 'm-config') })
  $('f-tempi').addEventListener('submit', (e) => { e.preventDefault(); ammin('tempi', { puntate: Number(e.target.puntate.value), decisione: Number(e.target.decisione.value) }, 'm-config') })
  document.querySelector('[data-cmd="azzera"]').addEventListener('click', () => { if (confirm('azzerare il tavolo? la mano in corso si perde, i giocatori e i $pzk restano.')) ammin('azzera') })
  document.querySelector('[data-cmd="chiudi"]').addEventListener('click', () => { key = ''; priv = null; try { sessionStorage.removeItem('bj-key') } catch {} ; clearInterval(timer); render() })

  function avvia() {
    clearInterval(timer)
    timer = setInterval(() => { if (!document.hidden && key) ammin('elenco') }, 5000)
  }
  if (key) ammin('elenco', {}, 'm-chiave').then((j) => { if (j) avvia() })
  else render()
})()
</script>
</body>
</html>
